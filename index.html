<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salto 360</title>
<meta name="description" content="Receitas, despesas e resultado de cada mês do Salto das Nuvens.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#241e19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salto 360">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<script>
/* Instalado como aplicativo: abre o Salto 360 direto */
(function(){var app=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true||/[?&]app=/.test(location.search);
if(app)location.replace('https://claude.ai/artifact/7HpCK9sSfzPmE7nh3amiHP');})();
</script>
<style>
:root{--terra:#241e19;--terra2:#35261d;--creme:#fff5e5;--sec:#d2bea3;--rust:#a9442c;--gold:#e6a43d}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:var(--terra);color:var(--creme);font-family:"DM Sans","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:36px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--rust) 0 14px,var(--gold) 14px 20px)}
main{width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
img.logo{width:104px;height:104px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;text-transform:uppercase;font-size:3.2rem;line-height:.9;margin:4px 0 0}
h1 span{color:var(--gold)}
.tag{color:var(--sec);margin:0;font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;background:var(--rust);color:var(--creme);border:2px solid var(--gold);box-shadow:4px 4px 0 #0d0b09;text-decoration:none;font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;box-shadow:none;border-color:var(--sec);text-transform:none;letter-spacing:0;font-size:.95rem;min-height:46px}
.btn.sec:hover{border-color:var(--gold)}
.how{width:100%;background:var(--terra2);border:2px solid #4a3a2c;padding:12px 14px;text-align:left;font-size:.88rem;color:var(--sec);line-height:1.5}
.how b{color:var(--creme)}
.how p{margin:4px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<img class="logo" src="icon-512.png" alt="">
<h1>Salto <span>360</span></h1>
<p class="tag">Receitas, despesas e resultado de cada mês do Salto das Nuvens.</p>
<a class="btn" href="https://claude.ai/artifact/7HpCK9sSfzPmE7nh3amiHP">Abrir o Salto 360</a>
<button class="btn sec" id="inst" type="button" hidden>Instalar o Salto 360 neste aparelho</button>
<div class="how" id="how"></div>
</main>
<script>
var ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isAndroid=/Android/.test(ua);
document.getElementById('how').innerHTML=isIOS?'<p><b>Para ter o ícone no iPhone:</b> no Safari, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>.</p>'
:isAndroid?'<p><b>Para ter o ícone no Android:</b> no Chrome, toque em ⋮ e depois em <b>Adicionar à tela inicial</b> → <b>Instalar</b>.</p>'
:'<p><b>Para ter o ícone no computador:</b> clique em <b>Instalar o Salto 360 neste aparelho</b> ou no ícone de instalar na barra de endereço do Chrome ou do Edge.</p><p>Depois de instalado, ele abre numa janela própria, como um programa.</p>';
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
var ev=null,b=document.getElementById('inst');
addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;b.hidden=false});
b.onclick=function(){if(!ev)return;ev.prompt();ev.userChoice.then(function(){b.hidden=true})};
addEventListener('appinstalled',function(){b.hidden=true});
</script>
</body>
</html>
